apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: shop
spec:
  replicas: 3
  template:
    spec:
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
      containers:
        - name: checkout
          image: ghcr.io/acme/checkout:latest   # <- flagged: mutable tag
        - name: envoy
          image: envoyproxy/envoy               # <- flagged: no tag
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nightly-report
  namespace: shop
spec:
  schedule: "0 2 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: report
              image: ghcr.io/acme/report@sha256:6f9c...  # <- pinned by digest, OK
